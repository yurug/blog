<script>
(async () => {
  "use strict";
  // Passwords are kept per-origin in the browser only, never sent over the
  // network. Any script on this origin can read them; see README-private.md.
  const STORE_KEY = "yrg:private:pw";
  const MAX_SAVED = 10;

  const payload = JSON.parse(document.getElementById("payload").textContent);
  const td = new TextDecoder();
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  const statusEl = document.getElementById("status");
  const gate = document.getElementById("gate");
  const msg = document.getElementById("msg");
  const pwEl = document.getElementById("pw");

  async function decrypt(password) {
    const km = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(payload.salt), iterations: payload.kdf.iter, hash: payload.kdf.hash },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    // AES-GCM throws if the auth tag fails, i.e. on a wrong password.
    const buf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64(payload.iv) }, key, b64(payload.ct));
    return td.decode(buf);
  }

  function readStore(store) {
    try { return JSON.parse(store.getItem(STORE_KEY) || "[]"); } catch (e) { return []; }
  }
  function savedPasswords() {
    // Most-recently-used first; localStorage takes priority over session.
    const merged = [...readStore(localStorage), ...readStore(sessionStorage)];
    return [...new Set(merged)];
  }
  function remember(password, persist) {
    const store = persist ? localStorage : sessionStorage;
    const next = [password, ...readStore(store).filter((p) => p !== password)].slice(0, MAX_SAVED);
    try { store.setItem(STORE_KEY, JSON.stringify(next)); } catch (e) {}
  }

  function render(html) {
    // Replace the whole document with the decrypted page.
    document.open();
    document.write(html);
    document.close();
  }

  function showGate(message) {
    statusEl.classList.add("hidden");
    gate.classList.remove("hidden");
    if (message) msg.textContent = message;
    pwEl.focus();
  }

  // 1) Try every saved password automatically (master password lands first).
  const saved = savedPasswords();
  for (const p of saved) {
    try {
      const html = await decrypt(p);
      remember(p, true);
      render(html);
      return;
    } catch (e) { /* not this one */ }
  }

  // 2) No saved password worked: ask for one.
  showGate();
  gate.addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = pwEl.value;
    if (!password) return;
    msg.textContent = "Decrypting…";
    try {
      const html = await decrypt(password);
      remember(password, document.getElementById("remember").checked);
      render(html);
    } catch (err) {
      msg.textContent = "Wrong password. Try again.";
      pwEl.value = "";
      pwEl.focus();
    }
  });
  document.getElementById("forget").addEventListener("click", (e) => {
    e.preventDefault();
    try { localStorage.removeItem(STORE_KEY); sessionStorage.removeItem(STORE_KEY); } catch (e2) {}
    msg.textContent = "Saved passwords cleared on this device.";
  });
})();
</script>
